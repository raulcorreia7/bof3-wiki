name: pages
# Builds the site and validates it; main deploys to Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The site build is the slow part; a PR that touches only workflow or policy files skips it.
  # This job always runs, so the required `build` check still reports.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename')"
          if [ -n "$paths" ] && ! grep -vqE '^(\.github/|LICENSE|CODE_OF_CONDUCT\.md|SECURITY\.md)' <<< "$paths"; then
            echo "site=false" >> "$GITHUB_OUTPUT"
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # page "last updated" dates come from git history
      - if: needs.changes.outputs.site == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - if: needs.changes.outputs.site == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/lychee
          key: lychee-${{ runner.os }}-${{ hashFiles('tools/check_links.sh') }}
      - if: needs.changes.outputs.site == 'true'
        run: npm ci
      # Format, page template, build, diagrams and internal links: the local gate.
      - if: needs.changes.outputs.site == 'true'
        run: npm run check
      - if: github.event_name != 'pull_request' && needs.changes.outputs.site == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
